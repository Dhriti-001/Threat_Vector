{% extends "base.html" %}

{% block title %}Create Account | Threat Vector{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto 0.75rem; width: 52px; height: 52px; font-size: 1.75rem;">🛡️</div>
        <span class="badge badge-ai" style="margin-bottom: 0.5rem;">Step 1: Account Setup</span>
        <h2 style="font-size: 1.65rem; color: var(--brand-navy); font-weight: 800;">Register New Trainee</h2>
        <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.35rem;">Create your profile for personal cognitive risk scoring</p>
    </div>

    <form action="{{ url_for('signup') }}" method="POST">
        <div class="form-group">
            <label class="form-label" for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Alex Johnson" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Choose a unique username" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
            Register & Open Dashboard
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.92rem; color: var(--text-secondary);">
        Already have an account? <a href="{{ url_for('login') }}" style="color: var(--brand-blue); font-weight: 700; text-decoration: none;">Sign in here</a>
    </div>
</div>
{% endblock %}
